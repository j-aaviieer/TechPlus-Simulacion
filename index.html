<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPlus - Simulacion</title>
    <link rel="stylesheet" href="static/css/style.css">
    <!--Link para los iconos-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!--Encabezado de la pagina-->
    <header>
        <div class="logo">
            <div class="logoLeft">
                <img src="static/img/logo.png" alt="logo">
            </div>
            <div class="logoRight">
                <h1>Tech<span>Plus</span></h1>
                <p>Soluciones informáticas</p>
            </div>
        </div>
        <div class="navbarLinks">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </div>
        <div class="buscador">
            <input type="text" placeholder="Buscar servicios...">
            <button>Buscar</button>
        </div>
    </header>
    <main>
        <div class="inicio">
            <div class="inicioLeft">
                <p class="subtitulo">SOPORTE Y SOLUCIONES</p>
                <h1>Tecnología que impulsa tu negocio</h1>
                <p>Soporte, desarrollo y asesoría informática para empresas y personas.</p>
                <button>Ver servicios <i class="fa-solid fa-arrow-right-long"></i></button>
            </div>
            <div class="inicioRight">
                <div class="imageContainer"> <!--Ponerle un background-->
                    <div class="imageButtons">
                        <button><i class="fa-solid fa-angle-left fa-2xl"></i></button>
                        <button><i class="fa-solid fa-angle-right fa-2xl"></i></button>
                    </div>
                    <div class="imageFooter">
                        <p>Soporte técnico en terreo</p>
                        <div class="imageSelected">
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div></div>
        <div></div>
    </main>
    <footer></footer>
</body>
</html>
